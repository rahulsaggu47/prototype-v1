{% extends "base.html" %}
{% block content %}

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/favorites.css">

<style>
  /* Watchlist-specific overrides on top of favorites.css */
  .wl-tabs {
    display: flex; gap: 10px; margin-bottom: 0;
  }
  .wl-tab {
    padding: 9px 22px; border-radius: 999px; font-size: 13px; font-weight: 600;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
    color: #6b7280; cursor: pointer; transition: all 0.25s;
  }
  .wl-tab.active {
    background: rgba(127,92,255,0.12); border-color: rgba(127,92,255,0.4); color: #a78bfa;
  }
  .wl-tab.active.completed {
    background: rgba(34,197,94,0.1); border-color: rgba(34,197,94,0.35); color: #4ade80;
  }
  .status-badge {
    position: absolute; top: 10px; right: 10px;
    padding: 3px 9px; border-radius: 6px; font-size: 10px; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase;
    backdrop-filter: blur(8px);
  }
  .badge-plan {
    background: rgba(127,92,255,0.25); border: 1px solid rgba(127,92,255,0.4); color: #c4b5fd;
  }
  .badge-done {
    background: rgba(34,197,94,0.2); border: 1px solid rgba(34,197,94,0.4); color: #4ade80;
  }
</style>

<!-- NAV -->
<nav class="fav-nav">
  <a href="{{ url_for('welcome') }}" class="fav-logo">NextWatch</a>
  <div class="fav-nav-right">
    <a href="{{ url_for('home', type='anime') }}" class="fav-pill anime-p">Animes</a>
    <a href="{{ url_for('home', type='movie') }}" class="fav-pill movie-p">Movies</a>
    {% if user %}
      <a href="{{ url_for('profile') }}"><img src="/static/{{ user.avatar_value }}" class="fav-nav-av"></a>
      <a href="/logout" class="fav-pill">Logout</a>
    {% else %}
      <a href="/login" class="fav-pill">Login</a>
    {% endif %}
  </div>
</nav>

<div class="fav-page">

  <!-- HEADER -->
  <div class="fav-header">
    <div class="fav-header-inner">
      <div class="fav-title-block">
        <div class="fav-eyebrow">
          <span class="fav-eyebrow-line"></span>
          Your Lists
        </div>
        <h1 class="fav-page-title">My <span class="accent-word">Watchlist</span></h1>
        <div class="fav-count-badge">
          <span class="fav-count-num" id="totalCount">—</span>
          <span id="totalLabel">titles</span>
        </div>
      </div>
    </div>
  </div>

  <!-- FILTER BAR -->
  <div class="fav-filter-bar">
    <div class="filter-chips wl-tabs">
      <button class="wl-tab active" data-status="all">All</button>
      <button class="wl-tab" data-status="plan_to_watch">📋 Plan to Watch</button>
      <button class="wl-tab completed" data-status="completed">✅ Completed</button>
    </div>
    <div class="fav-sort">
      <span class="sort-label">Type</span>
      <select class="fav-sort-select" id="typeFilter">
        <option value="">All</option>
        <option value="anime">Anime</option>
        <option value="movie">Movie</option>
      </select>
    </div>
  </div>

  <div class="fav-divider"></div>

  <!-- GRID -->
  <div class="fav-grid-wrap">
    <div id="loadingState" class="fav-loading">
      <div class="loading-dot"></div>
      <div class="loading-dot"></div>
      <div class="loading-dot"></div>
    </div>

    <div class="fav-grid" id="wlGrid" style="display:none"></div>

    <div class="fav-empty" id="emptyState">
      <div class="empty-orbit">
        <div class="empty-orbit-ring"></div>
        <div class="empty-orbit-ring"></div>
        <div class="empty-orbit-center">📋</div>
      </div>
      <h2 class="empty-title">Nothing here yet</h2>
      <p class="empty-sub" id="emptyMsg">Add titles to your watchlist from any detail page.</p>
      <a href="/" class="empty-cta">✦ Start Exploring</a>
    </div>
  </div>

</div>

<script>
let allItems = [];
let currentStatus = "all";
let currentType = "";

async function loadWatchlist() {
  const res  = await fetch("/api/watchlist");
  const data = await res.json();

  document.getElementById("loadingState").style.display = "none";
  document.getElementById("wlGrid").style.display = "block";

  allItems = data;
  renderWatchlist();
}

function renderWatchlist() {
  const grid    = document.getElementById("wlGrid");
  const empty   = document.getElementById("emptyState");
  const countEl = document.getElementById("totalCount");
  const labelEl = document.getElementById("totalLabel");
  const msgEl   = document.getElementById("emptyMsg");

  let items = [...allItems];

  if (currentStatus !== "all") items = items.filter(i => i.status === currentStatus);
  if (currentType)              items = items.filter(i => i.type  === currentType);

  countEl.textContent = items.length;
  labelEl.textContent = currentStatus === "plan_to_watch" ? "to watch"
                      : currentStatus === "completed"     ? "completed"
                      : "titles";

  msgEl.textContent = currentStatus === "plan_to_watch"
    ? "Nothing in your Plan to Watch list yet."
    : currentStatus === "completed"
    ? "You haven't marked anything as completed yet."
    : "Add titles to your watchlist from any detail page.";

  grid.innerHTML = "";

  if (!items.length) {
    empty.classList.add("show");
    return;
  }

  empty.classList.remove("show");

  items.forEach((item, idx) => {
    const card = document.createElement("div");
    card.className = "fav-card";
    card.dataset.id = item.id;
    card.style.animationDelay = `${Math.min(idx * 0.05, 0.5)}s`;

    const isPlan  = item.status === "plan_to_watch";
    const badgeCls  = isPlan ? "badge-plan" : "badge-done";
    const badgeTxt  = isPlan ? "Plan to Watch" : "Completed";
    const toggleTxt = isPlan ? "✅ Mark Completed" : "📋 Move to Plan";
    const toggleSt  = isPlan ? "completed" : "plan_to_watch";

    card.innerHTML = `
      <div class="fav-type-badge badge-${item.type}">${item.type}</div>
      <span class="status-badge ${badgeCls}">${badgeTxt}</span>
      <img src="${item.poster_url}" alt="${item.title}" loading="lazy">
      <div class="fav-card-overlay">
        <div class="fav-card-title">${item.title}</div>
        <div class="fav-card-meta">
          <span class="fav-card-type">${item.release_year || ''}</span>
          <div style="display:flex;gap:6px">
            <button class="fav-remove-btn" style="width:auto;padding:0 8px;font-size:10px;border-radius:6px;background:rgba(127,92,255,0.2);border-color:rgba(127,92,255,0.4);color:#a78bfa"
              title="${toggleTxt}" data-id="${item.id}" data-status="${toggleSt}">⇄</button>
            <button class="fav-remove-btn" title="Remove from watchlist" data-id="${item.id}" data-remove="1">✕</button>
          </div>
        </div>
      </div>
    `;

    // Navigate on card click
    card.addEventListener("click", (e) => {
      if (e.target.closest("button")) return;
      window.location.href = `/content/${item.id}`;
    });

    // Toggle status
    card.querySelector("[data-status]").addEventListener("click", async (e) => {
      e.stopPropagation();
      const newStatus = e.currentTarget.dataset.status;
      await fetch("/api/watchlist/add", {
        method: "POST", headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ content_id: item.id, status: newStatus })
      });
      allItems = allItems.map(i => i.id === item.id ? {...i, status: newStatus} : i);
      renderWatchlist();
    });

    // Remove
    card.querySelector("[data-remove]").addEventListener("click", async (e) => {
      e.stopPropagation();
      card.classList.add("removing");
      await fetch("/api/watchlist/remove", {
        method: "POST", headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ content_id: item.id })
      });
      setTimeout(() => {
        allItems = allItems.filter(i => i.id !== item.id);
        renderWatchlist();
      }, 300);
    });

    grid.appendChild(card);
  });
}

// Status tabs
document.querySelectorAll(".wl-tab").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".wl-tab").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentStatus = btn.dataset.status;
    renderWatchlist();
  });
});

// Type filter
document.getElementById("typeFilter").addEventListener("change", function() {
  currentType = this.value;
  renderWatchlist();
});

loadWatchlist();
</script>

{% endblock %}
